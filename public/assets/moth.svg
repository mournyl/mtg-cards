<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- mournyl moth: an original drawing in grays, with a soft glow and a dusty wing texture -->
  <defs>
    <radialGradient id="fw" cx="0.06" cy="0.62" r="1.08">
      <stop offset="0" stop-color="#fbfbfb"/>
      <stop offset="0.32" stop-color="#d9d9d9"/>
      <stop offset="0.68" stop-color="#8d8d8d"/>
      <stop offset="1" stop-color="#2f2f2f"/>
    </radialGradient>
    <radialGradient id="hw" cx="0.04" cy="0.18" r="1.12">
      <stop offset="0" stop-color="#ededed"/>
      <stop offset="0.5" stop-color="#a6a6a6"/>
      <stop offset="1" stop-color="#2a2a2a"/>
    </radialGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e9e9"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <radialGradient id="eye">
      <stop offset="0" stop-color="#f4f4f4" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#cfcfcf" stop-opacity=".6"/>
      <stop offset=".55" stop-color="#1a1a1a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <!-- dust on the wings: grey noise multiplied over the wing colors, kept inside the wing shapes -->
    <filter id="dust" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".045 .09" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2">
        <feFuncR type="linear" slope=".7" intercept=".5"/><feFuncG type="linear" slope=".7" intercept=".5"/><feFuncB type="linear" slope=".7" intercept=".5"/>
        <feFuncA type="linear" slope="0" intercept="1"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="g2" mode="multiply" result="m"/>
      <feComposite in="m" in2="SourceGraphic" operator="in"/>
    </filter>
    <g id="wing">
      <!-- forewing: a hooked tip, a gently wavy back edge -->
      <path d="M123 90 C138 66 166 40 210 22 C222 17 231 21 229 30 C226 42 221 50 216 58 C214 66 210 72 205 80 C198 86 190 90 180 94 C164 99 144 101 123 100 Z" fill="url(#fw)" fill-opacity=".95"/>
      <!-- hindwing: rounded, scalloped -->
      <path d="M122 102 C148 101 180 106 194 120 C202 129 201 140 196 148 C193 156 186 160 180 166 C172 172 160 172 150 166 C140 160 132 152 127 140 C123 130 121 116 122 102 Z" fill="url(#hw)" fill-opacity=".93"/>
      <!-- veins -->
      <g fill="none" stroke="#1e1e1e" stroke-opacity=".3" stroke-width=".8" stroke-linecap="round">
        <path d="M125 95 C150 76 182 50 222 26"/>
        <path d="M127 97 C154 88 184 72 212 60"/>
        <path d="M129 99 C156 97 182 92 202 84"/>
        <path d="M152 82 C162 76 170 70 176 58"/>
        <path d="M125 105 C150 110 176 120 194 132"/>
        <path d="M125 107 C146 122 166 140 182 162"/>
        <path d="M124 109 C131 128 140 148 154 166"/>
      </g>
      <!-- dark tip patch, eye spots -->
      <path d="M196 32 C206 26 220 20 228 24 C227 36 222 48 214 60 C208 50 202 40 196 32 Z" fill="#141414" fill-opacity=".38"/>
      <circle cx="171" cy="80" r="9" fill="url(#eye)"/>
      <circle cx="166" cy="138" r="11" fill="url(#eye)"/>
      <!-- pale fringe -->
      <path d="M210 22 C222 17 231 21 229 30 C226 42 221 50 216 58 C214 66 210 72 205 80" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1"/>
      <path d="M194 120 C202 129 201 140 196 148 C193 156 186 160 180 166 C172 172 160 172 150 166" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1"/>
    </g>
  </defs>
  <g filter="url(#glow)" opacity=".28"><use href="#wing"/><use href="#wing" transform="translate(240 0) scale(-1 1)"/></g>
  <g filter="url(#dust)">
    <use href="#wing"/>
    <use href="#wing" transform="translate(240 0) scale(-1 1)"/>
  </g>
  <!-- antennae, feathered -->
  <g fill="none" stroke-linecap="round">
    <path d="M117 70 C110 52 100 38 86 24" stroke="#cfcfcf" stroke-width="1"/>
    <path d="M123 70 C130 52 140 38 154 24" stroke="#cfcfcf" stroke-width="1"/>
    <path d="M117 70 C110 52 100 38 86 24" stroke="#a9a9a9" stroke-width="3.6" stroke-dasharray=".6 1.9" stroke-opacity=".45"/>
    <path d="M123 70 C130 52 140 38 154 24" stroke="#a9a9a9" stroke-width="3.6" stroke-dasharray=".6 1.9" stroke-opacity=".45"/>
  </g>
  <!-- head, furry thorax, abdomen -->
  <circle cx="120" cy="74" r="5.5" fill="url(#bd)"/>
  <ellipse cx="120" cy="89" rx="8.5" ry="12.5" fill="url(#bd)"/>
  <ellipse cx="120" cy="89" rx="8.5" ry="12.5" fill="none" stroke="#dcdcdc" stroke-opacity=".35" stroke-width="2.5" stroke-dasharray=".5 1.6"/>
  <ellipse cx="120" cy="117" rx="6" ry="19" fill="url(#bd)"/>
  <g fill="none" stroke="#2e2e2e" stroke-opacity=".45" stroke-width=".7">
    <path d="M114.5 106 Q120 109 125.5 106"/><path d="M114.5 114 Q120 117 125.5 114"/><path d="M115 122 Q120 125 125 122"/><path d="M116 130 Q120 132.5 124 130"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
